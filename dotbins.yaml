tools_dir: ~/.tool-bin

defaults:
  prefer_appimage: true
  libc: musl

platforms:
  linux:
    - amd64
    - arm64

tools:
  bat: sharkdp/bat
  pastel: sharkdp/pastel
  hexyl: sharkdp/hexyl
  hyperfine: sharkdp/hyperfine
  rg: BurntSushi/ripgrep
  duf: muesli/duf
  dust: bootandy/dust
  eza: eza-community/eza
  git-lfs: git-lfs/git-lfs
  difft: Wilfred/difftastic
  tldr: tealdeer-rs/tealdeer
  yq: mikefarah/yq
  gum: charmbracelet/gum
  glow: charmbracelet/glow
  freeze: charmbracelet/freeze
  vhs: charmbracelet/vhs
  caligula: ifd3f/caligula
  typst: typst/typst
  slides: maaslalani/slides
  sk: skim-rs/skim
  handy: cjpais/Handy

  ttyd:
    repo: tsl0922/ttyd
    arch_map:
      amd64: x86_64
    asset_patterns: ttyd.{arch}

  zestty:
    repo: aidantlynch00/zestty
    asset_patterns: zestty.zip
    binary_name: [zestty, zestty.wasm]
    path_in_archive: [zestty, zestty.wasm]
    shell_code:
      bash: |
        source $HOME/.tool-bin/shell/bash/setup/zestty.sh

  atac:
    repo: Julien-cpsn/ATAC
    shell_code:
      bash: |
        export ATAC_KEY_BINDINGS=$HOME/.config/atac/keybinds.toml

  mise:
    repo: jdx/mise
    shell_code:
      bash: |
        eval "$(mise activate bash)"

  ghostty:
    repo: pkgforge-dev/ghostty-appimage
    tag: v1.1.2

  fastfetch:
    repo: fastfetch-cli/fastfetch
    shell_code:
      bash: |
        fastfetch

  lazygit:
    repo: jesseduffield/lazygit
    shell_code:
      bash: |
        alias lg="lazygit"

  opencode:
    repo: sst/opencode
    arch_map:
      amd64: x64
    asset_patterns:
      linux: opencode-{platform}-{arch}-baseline.tar.gz
    shell_code:
      bash: |
        source $HOME/.tool-bin/shell/bash/setup/opencode.sh

  fzf:
    repo: junegunn/fzf
    shell_code:
      bash: |
        source $HOME/.tool-bin/shell/bash/setup/fzf.sh

  nvim:
    repo: neovim/neovim
    tag: nightly
    shell_code:
      bash: |
        export EDITOR="nvim"

  yazi:
    repo: sxyazi/yazi
    shell_code:
      bash: |
        source $HOME/.tool-bin/shell/bash/setup/yazi.sh

  zellij:
    repo: zellij-org/zellij
    shell_code:
      bash: |
        alias zj="zellij"

  zjstatus:
    repo: dj95/zjstatus
    binary_name: zjstatus.wasm
    asset_patterns: zjstatus.wasm

  starship:
    repo: starship/starship
    shell_code:
      bash: |
        source $HOME/.tool-bin/shell/bash/setup/starship.sh

  uv:
    repo: astral-sh/uv
    binary_name: [uv, uvx]
    path_in_archive: [uv-*/uv, uv-*/uvx]
